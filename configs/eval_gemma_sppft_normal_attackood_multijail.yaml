model_path: output_models/gemma_sppft_normal
tokenizer_path: google/gemma-2b-it
trust_remote_code: false
device_map: auto
dtype: float32

advbench_path: data/attack_ood_multijail.csv   # field name kept from the original config
                                                 # schema -- this is the MultiJail covariate/
                                                 # multilingual Attack-OOD test: 315 base
                                                 # prompts x 9 non-English languages = 2,835.
                                                 # KNOWN CONFOUND (see build script's docstring):
                                                 # MultiJail's base content is Anthropic/OpenAI-
                                                 # sourced, NOT AdvBench -- used as-is per
                                                 # explicit user decision, not a clean language-
                                                 # only isolate. See scripts/build_attack_ood_multijail.py.
max_prompts: null

prompt_template: alpaca
max_new_tokens: 128
pad_token_id: 0

use_zou_keyword_classifier: true
use_harmbench_classifier: true
judge_model: claude-haiku-4-5-20251001
judge_max_samples: null

save_dir: results/
run_name: gemma_sppft_normal_attackood_multijail
