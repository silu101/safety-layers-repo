# Config for reproducing paper Fig. 1 / Section 3.3 on Phi-3-mini-4k-instruct.
# All values below are the DEFAULTS FROM THE ORIGINAL SCRIPT
# (Code/Cos_sim_analysis/save_all_pairs_cos_sim.py) unless commented otherwise.
# Override any field from the CLI, e.g.:
#   python -m safety_layers_repro.run_cos_sim --config configs/phi3_cossim.yaml --set r=50

normal_path: data/normal.csv
malicious_path: data/malicious.csv

model_path: microsoft/Phi-3-mini-4k-instruct
prompt_template: alpaca
trust_remote_code: true
device_map: auto
dtype: auto

temperature: 0.5
top_p: 0.2
top_k: 40
num_beams: 4
max_new_tokens: 1
pad_token_id: 0

r: 500          # paper's r; use --set r=20 for a quick smoke test on a GPU box
seed_nn: 10
seed_mm: 100
seed_nm: 1000

save_dir: results/
run_name: null   # auto-generated from model name + timestamp if left null
