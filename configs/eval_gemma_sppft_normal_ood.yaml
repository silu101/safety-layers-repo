model_path: output_models/gemma_sppft_normal
tokenizer_path: google/gemma-2b-it
trust_remote_code: false
device_map: auto
dtype: float32

advbench_path: data/ood_semantic_test.csv   # field name kept from the original
                                             # config schema -- this is the semantic-
                                             # content OOD test set (100 prompts, 20
                                             # each from the 5 confirmed-OOD categories:
                                             # hate_discrimination, harassment,
                                             # sexual_content, privacy,
                                             # political_misinformation), NOT AdvBench.
                                             # See scripts/build_ood_semantic_test.py.
max_prompts: null

prompt_template: alpaca
max_new_tokens: 128
pad_token_id: 0

use_zou_keyword_classifier: true
use_harmbench_classifier: true
judge_model: claude-haiku-4-5-20251001
judge_max_samples: null

save_dir: results/
run_name: gemma_sppft_normal_ood_semantic
