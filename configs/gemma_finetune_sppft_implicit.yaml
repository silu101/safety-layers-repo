# Section 4: SPPFT on gemma-2b-it with Implicit (DI) data.
# See gemma_finetune_full_implicit.yaml for the DI-via-Backdoor_dataset.json
# note, and gemma_finetune_sppft_normal.yaml for the begin_num/end_num=5,12
# freeze-range note.

method: sppft
base_model: google/gemma-2b-it
data_path: data/finetune/Backdoor_dataset.json   # used as DI -- see KNOWN_DISCREPANCIES.md #5
trust_remote_code: false

batch_size: 128
micro_batch_size: 4
num_epochs: 3
learning_rate: 1.0e-4
cutoff_len: 256
val_set_size: 100
warmup_steps: 100

train_on_inputs: true
add_eos_token: false
group_by_length: false
prompt_template_name: alpaca

if_freeze: true
begin_num: 5
end_num: 12

output_dir: output_models/gemma_sppft_implicit
save_dir: results/
run_name: null
