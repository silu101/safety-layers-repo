# Config for Section 3.4 safety-layer localization on gemma-2b-it,
# reproducing the ACTUAL paper-submission scaling behavior (not the
# current, later-edited GitHub version). See docs/KNOWN_DISCREPANCIES.md
# #17: the OpenReview supplementary archive's scaling()/scaling_phi3()
# have a bug where the o_proj weight update targets base_model instead of
# new_model, so o_proj is never actually scaled in the returned model.
# exclude_o_proj: true reproduces that same real (buggy) behavior.
#
# Otherwise identical to gemma_localization.yaml (target range [6,12),
# the paper's confirmed safety-layer range for gemma-2b-it).

over_rejection_path: data/over_rejection.csv
max_prompts: null

model_path: google/gemma-2b-it
prompt_template: alpaca
trust_remote_code: false
device_map: auto
dtype: float32
weight_style: llama
exclude_o_proj: true

temperature: 0.0
top_p: 0.2
top_k: 40
max_new_tokens: 16
pad_token_id: 0

start_num: 6
end_num: 12
cheng_num: 1.1

save_dir: results/
run_name: null
