# Config for reproducing paper Fig. 1 / Section 3.3 on Meta-Llama-3-8B-Instruct.
# Same method/params as phi3_cossim.yaml (see that file's comments) --
# just a different target model. Gated on Hugging Face under Meta's org,
# separately from Llama-2-7b-chat-hf -- needs its own approved access
# request, and an HF_TOKEN (or GEMINI_TOKEN -- see kaggle/kernel_runner.py)
# Kaggle Secret enabled for this kernel.
# Override any field from the CLI, e.g.:
#   python -m safety_layers_repro.run_cos_sim --config configs/llama3_cossim.yaml --set r=50

normal_path: data/normal.csv
malicious_path: data/malicious.csv

model_path: meta-llama/Meta-Llama-3-8B-Instruct
prompt_template: alpaca
trust_remote_code: false  # Llama is natively supported in transformers, no remote code needed
device_map: auto
dtype: float32   # fidelity-matched to the paper authors' setup; do not change here —
                 # OOM fallback (if needed) is a runtime --set dtype=auto override, not a config edit

temperature: 0.5
top_p: 0.2
top_k: 40
num_beams: 4
max_new_tokens: 1
pad_token_id: 0

r: 500          # paper's r; use --set r=20 for a quick smoke test on a GPU box
seed_nn: 10
seed_mm: 100
seed_nm: 1000

save_dir: results/
run_name: null   # auto-generated from model name + timestamp if left null
